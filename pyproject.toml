[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emberpost"
version = "0.1.0"
description = "Threaded-conversation mailbox warmup for a Google Workspace sending domain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6,<7", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
emberpost = "warmup.cli:main"

[tool.setuptools]
packages = ["warmup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"warmup/content.py" = ["E501"]   # long email-template prose
